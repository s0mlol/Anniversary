
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Our Anniversary</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f7f7f5;
        color: #222;
    }

    .container {
        width: min(90%, 500px);
        padding: 35px 25px;
        text-align: center;
        background: white;
        border-radius: 24px;
        box-shadow: 0 10px 35px rgba(0, 0, 0, 0.07);
    }

    h1 {
        margin: 0 0 10px;
        font-size: 32px;
        font-weight: 600;
    }

    .subtitle {
        color: #777;
        margin-bottom: 30px;
    }

    .inputs {
        display: flex;
        gap: 10px;
        margin-bottom: 20px;
    }

    input {
        width: 100%;
        padding: 14px 10px;
        border: 1px solid #ddd;
        border-radius: 12px;
        font-size: 16px;
        text-align: center;
        outline: none;
        background: #fafafa;
    }

    input:focus {
        border-color: #999;
        background: white;
    }

    button {
        width: 100%;
        padding: 15px;
        border: none;
        border-radius: 12px;
        background: #222;
        color: white;
        font-size: 16px;
        cursor: pointer;
    }

    button:hover {
        opacity: 0.85;
    }

    .error {
        color: #c0392b;
        font-size: 14px;
        margin-top: 12px;
        min-height: 20px;
    }

    #result {
        display: none;
    }

    #result h2 {
        font-size: 27px;
        font-weight: 600;
        margin: 5px 0 25px;
    }

    .years {
        font-size: 58px;
        font-weight: 700;
        margin: 5px 0;
    }

    .label {
        color: #777;
        margin-bottom: 30px;
    }

    .countdown-title {
        font-size: 15px;
        color: #777;
        margin-bottom: 12px;
    }

    .countdown {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 8px;
    }

    .time-box {
        padding: 13px 5px;
        background: #f5f5f3;
        border-radius: 12px;
    }

    .time-number {
        display: block;
        font-size: 22px;
        font-weight: 600;
    }

    .time-label {
        display: block;
        font-size: 11px;
        color: #888;
        margin-top: 3px;
    }

    .back {
        margin-top: 25px;
        background: transparent;
        color: #555;
        border: 1px solid #ddd;
    }

    @media (max-width: 420px) {
        h1 {
            font-size: 28px;
        }

        .inputs {
            gap: 7px;
        }

        input {
            padding: 13px 5px;
        }

        .years {
            font-size: 48px;
        }
    }
</style>
</head>

<body>

<div class="container">

    <!-- DATE INPUT SCREEN -->
    <div id="setup">

        <h1>Our Anniversary</h1>

        <div class="subtitle">
            When did your journey begin?
        </div>

        <div class="inputs">

            <input
                id="day"
                type="number"
                min="1"
                max="31"
                placeholder="Day"
            >

            <input
                id="month"
                type="number"
                min="1"
                max="12"
                placeholder="Month"
            >

            <input
                id="year"
                type="number"
                min="1900"
                max="2100"
                placeholder="Year"
            >

        </div>

        <button id="continueBtn">
            Continue
        </button>

        <div id="error" class="error"></div>

    </div>


    <!-- RESULT SCREEN -->
    <div id="result">

        <h2 id="message"></h2>

        <div class="years" id="years">
            0
        </div>

        <div class="label">
            years together
        </div>

        <div class="countdown-title">
            Countdown to your next anniversary
        </div>

        <div class="countdown">

            <div class="time-box">
                <span class="time-number" id="days">0</span>
                <span class="time-label">DAYS</span>
            </div>

            <div class="time-box">
                <span class="time-number" id="hours">0</span>
                <span class="time-label">HOURS</span>
            </div>

            <div class="time-box">
                <span class="time-number" id="minutes">0</span>
                <span class="time-label">MINUTES</span>
            </div>

            <div class="time-box">
                <span class="time-number" id="seconds">0</span>
                <span class="time-label">SECONDS</span>
            </div>

        </div>

        <button class="back" id="backBtn">
            Change Date
        </button>

    </div>

</div>


<script>

let anniversaryDate;
let countdownTimer;


/* ELEMENTS */

const setup = document.getElementById("setup");
const result = document.getElementById("result");
const error = document.getElementById("error");


/* CONTINUE BUTTON */

document
    .getElementById("continueBtn")
    .addEventListener("click", start);


/* CHANGE DATE BUTTON */

document
    .getElementById("backBtn")
    .addEventListener("click", function () {

        clearInterval(countdownTimer);

        result.style.display = "none";
        setup.style.display = "block";

    });


/* START */

function start() {

    const day =
        Number(document.getElementById("day").value);

    const month =
        Number(document.getElementById("month").value);

    const year =
        Number(document.getElementById("year").value);


    error.textContent = "";


    /* CHECK EMPTY INPUTS */

    if (!day || !month || !year) {

        error.textContent =
            "Please enter the day, month and year.";

        return;
    }


    /* CHECK MONTH */

    if (month < 1 || month > 12) {

        error.textContent =
            "Please enter a valid month.";

        return;
    }


    /* CHECK DAY */

    if (day < 1 || day > 31) {

        error.textContent =
            "Please enter a valid day.";

        return;
    }


    /* CHECK YEAR */

    if (
        year < 1900 ||
        year > new Date().getFullYear()
    ) {

        error.textContent =
            "Please enter a valid year.";

        return;
    }


    /* CREATE DATE */

    anniversaryDate =
        new Date(year, month - 1, day);


    /* MAKE SURE DATE ACTUALLY EXISTS */

    if (
        anniversaryDate.getFullYear() !== year ||
        anniversaryDate.getMonth() !== month - 1 ||
        anniversaryDate.getDate() !== day
    ) {

        error.textContent =
            "That date doesn't exist. Please check it.";

        return;
    }


    /* FUTURE DATE CHECK */

    if (anniversaryDate > new Date()) {

        error.textContent =
            "The marriage date cannot be in the future.";

        return;
    }


    /* SHOW RESULT */

    setup.style.display = "none";
    result.style.display = "block";


    update();


    clearInterval(countdownTimer);

    countdownTimer =
        setInterval(update, 1000);

}


/* CALCULATE YEARS */

function calculateYears() {

    const now = new Date();

    let years =
        now.getFullYear() -
        anniversaryDate.getFullYear();


    const anniversaryThisYear =
        new Date(
            now.getFullYear(),
            anniversaryDate.getMonth(),
            anniversaryDate.getDate()
        );


    if (now < anniversaryThisYear) {
        years--;
    }


    return years;

}


/* NEXT ANNIVERSARY */

function getNextAnniversary() {

    const now = new Date();


    let next =
        new Date(
            now.getFullYear(),
            anniversaryDate.getMonth(),
            anniversaryDate.getDate()
        );


    if (next <= now) {

        next =
            new Date(
                now.getFullYear() + 1,
                anniversaryDate.getMonth(),
                anniversaryDate.getDate()
            );

    }


    return next;

}


/* UPDATE EVERYTHING */

function update() {

    const now = new Date();

    const years =
        calculateYears();

    const next =
        getNextAnniversary();


    /* YEARS */

    document.getElementById("years")
        .textContent = years;


    /* MESSAGE */

    document.getElementById("message")
        .textContent =
        `You have been married for ${years} ${
            years === 1 ? "year" : "years"
        }! And more to go!`;


    /* COUNTDOWN */

    let difference =
        next - now;


    if (difference < 0) {
        difference = 0;
    }


    const totalSeconds =
        Math.floor(difference / 1000);


    const days =
        Math.floor(totalSeconds / 86400);


    const hours =
        Math.floor(
            (totalSeconds % 86400) / 3600
        );


    const minutes =
        Math.floor(
            (totalSeconds % 3600) / 60
        );


    const seconds =
        totalSeconds % 60;


    document.getElementById("days")
        .textContent = days;


    document.getElementById("hours")
        .textContent =
        String(hours).padStart(2, "0");


    document.getElementById("minutes")
        .textContent =
        String(minutes).padStart(2, "0");


    document.getElementById("seconds")
        .textContent =
        String(seconds).padStart(2, "0");

}

</script>

</body>
</html>
