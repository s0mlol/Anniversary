<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Your Anniversary</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Helvetica,
                Arial,
                sans-serif;

            background: #f5f5f5;
            color: #171717;
            padding: 20px;

            overflow-x: hidden;
        }

        .card {
            width: 100%;
            max-width: 560px;

            background: rgba(255, 255, 255, 0.95);

            border: 1px solid #e5e5e5;
            border-radius: 24px;

            padding: 50px 40px;

            text-align: center;

            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.06);

            animation: appear 0.5s ease;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .heart {
            font-size: 40px;
            margin-bottom: 18px;

            color: #e63946;

            animation: heartbeat 2s infinite;
        }

        @keyframes heartbeat {
            0%, 100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.08);
            }
        }

        h1 {
            font-size: 30px;
            font-weight: 600;

            letter-spacing: -0.5px;

            margin-bottom: 10px;
        }

        .subtitle {
            color: #777;

            font-size: 15px;
            line-height: 1.6;

            margin-bottom: 35px;
        }

        .setup {
            display: block;
        }

        .setup.hidden {
            display: none;
        }

        /* DATE INPUT */

        .date-input {
            display: block;

            width: 100% !important;
            max-width: 100% !important;
            min-width: 0 !important;

            height: 52px;

            padding: 15px 16px;

            border: 1px solid #dcdcdc;
            border-radius: 12px;

            background: #fafafa;

            font-family: inherit;
            font-size: 16px;
            color: #171717;

            outline: none;

            margin: 0;

            box-sizing: border-box !important;

            -webkit-appearance: none;
            appearance: none;

            overflow: hidden;

            /*
             * CENTER THE DATE TEXT
             */
            text-align: center;

            transition:
                background 0.2s,
                border-color 0.2s,
                box-shadow 0.2s;
        }

        /*
         * iPhone / Safari date text
         */
        .date-input::-webkit-date-and-time-value {
            text-align: center;
        }

        .date-input:focus {
            background: white;

            border-color: #999;

            box-shadow:
                0 0 0 3px rgba(0, 0, 0, 0.04);
        }

        /* BUTTON */

        button {
            width: 100%;

            margin-top: 14px;

            padding: 15px;

            border: none;
            border-radius: 12px;

            background: #171717;
            color: white;

            font-family: inherit;
            font-size: 15px;
            font-weight: 500;

            cursor: pointer;

            transition:
                transform 0.2s,
                opacity 0.2s;
        }

        button:hover {
            opacity: 0.88;

            transform: translateY(-1px);
        }

        button:active {
            transform: translateY(0);
        }

        /* COUNTDOWN */

        .countdown {
            display: none;
        }

        .countdown.show {
            display: block;
        }

        .label {
            color: #888;

            font-size: 14px;

            margin-bottom: 8px;
        }

        .days {
            font-size: 76px;

            line-height: 1;

            font-weight: 700;

            letter-spacing: -3px;

            margin: 10px 0;
        }

        .days-text {
            font-size: 15px;

            color: #777;

            margin-bottom: 28px;
        }

        .timer {
            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 10px;

            margin-bottom: 28px;
        }

        .time-box {
            background: #f7f7f7;

            border-radius: 12px;

            padding: 14px 8px;
        }

        .time-number {
            font-size: 21px;

            font-weight: 600;
        }

        .time-label {
            color: #888;

            font-size: 11px;

            margin-top: 3px;
        }

        .next-date {
            color: #888;

            font-size: 13px;

            margin-bottom: 20px;
        }

        .change-button {
            background: transparent;

            color: #777;

            border: 1px solid #ddd;

            margin-top: 0;
        }

        .change-button:hover {
            color: #171717;

            background: #fafafa;
        }

        /* ANNIVERSARY */

        .anniversary {
            display: none;
        }

        .anniversary.show {
            display: block;

            animation: appear 0.6s ease;
        }

        .big-heart {
            font-size: 65px;

            color: #e63946;

            margin-bottom: 20px;

            animation: heartbeat 1.5s infinite;
        }

        .anniversary h2 {
            font-size: 32px;

            font-weight: 600;

            line-height: 1.3;

            margin-bottom: 15px;
        }

        .years {
            font-size: 60px;

            font-weight: 700;

            letter-spacing: -2px;

            margin: 10px 0;
        }

        .anniversary-text {
            color: #777;

            font-size: 15px;

            line-height: 1.6;

            margin-bottom: 25px;
        }

        .anniversary-text strong {
            color: #171717;
        }

        .anniversary-date {
            color: #999;

            font-size: 13px;
        }

        /* MOBILE */

        @media (max-width: 500px) {

            .card {
                padding: 40px 25px;

                border-radius: 20px;

                overflow: hidden;
            }

            h1 {
                font-size: 26px;
            }

            .days {
                font-size: 62px;
            }

            .years {
                font-size: 50px;
            }

            .anniversary h2 {
                font-size: 27px;
            }

            .timer {
                gap: 7px;
            }

            .time-box {
                padding: 12px 5px;
            }

            /*
             * DATE BOX
             */

            .date-input {
                width: 100% !important;
                max-width: 100% !important;
                min-width: 0 !important;

                height: 52px;

                margin-left: 0 !important;
                margin-right: 0 !important;

                box-sizing: border-box !important;

                text-align: center;
            }

            .date-input::-webkit-date-and-time-value {
                text-align: center;
            }
        }
    </style>
</head>

<body>

    <main class="card">

        <!-- SETUP -->

        <section class="setup" id="setup">

            <div class="heart">♥</div>

            <h1>Your Anniversary</h1>

            <p class="subtitle">
                Enter the date your parents got married
                and we'll keep track of their special day.
            </p>

            <input
                type="date"
                id="weddingDate"
                class="date-input"
                aria-label="Wedding date"
            >

            <button
                type="button"
                onclick="saveDate()"
            >
                Continue
            </button>

        </section>


        <!-- COUNTDOWN -->

        <section
            class="countdown"
            id="countdown"
        >

            <div class="heart">♥</div>

            <div class="label">
                Until your anniversary
            </div>

            <div
                class="days"
                id="days"
            >
                0
            </div>

            <div class="days-text">
                days more for your anniversary
            </div>

            <div class="timer">

                <div class="time-box">

                    <div
                        class="time-number"
                        id="hours"
                    >
                        00
                    </div>

                    <div class="time-label">
                        HOURS
                    </div>

                </div>

                <div class="time-box">

                    <div
                        class="time-number"
                        id="minutes"
                    >
                        00
                    </div>

                    <div class="time-label">
                        MINUTES
                    </div>

                </div>

                <div class="time-box">

                    <div
                        class="time-number"
                        id="seconds"
                    >
                        00
                    </div>

                    <div class="time-label">
                        SECONDS
                    </div>

                </div>

            </div>

            <div
                class="next-date"
                id="nextDate"
            ></div>

            <button
                type="button"
                class="change-button"
                onclick="changeDate()"
            >
                Change wedding date
            </button>

        </section>


        <!-- ANNIVERSARY -->

        <section
            class="anniversary"
            id="anniversary"
        >

            <div class="big-heart">
                ♥
            </div>

            <h2>
                Happy Anniversary<br>
                Amma and Appa
            </h2>

            <div
                class="years"
                id="years"
            >
                0
            </div>

            <p class="anniversary-text">

                You have been married for

                <strong id="yearsText">
                    0 years
                </strong>

                and many more to go.

            </p>

            <div
                class="anniversary-date"
                id="anniversaryDate"
            ></div>

            <button
                type="button"
                class="change-button"
                onclick="changeDate()"
            >
                Change wedding date
            </button>

        </section>

    </main>


    <script>

        let weddingDate =
            localStorage.getItem("weddingDate");

        let countdownInterval = null;


        /*
         * LOAD SAVED DATE
         */

        if (weddingDate) {
            startCountdown();
        }


        /*
         * SAVE DATE
         */

        function saveDate() {

            const input =
                document.getElementById(
                    "weddingDate"
                );

            if (!input.value) {

                alert(
                    "Please enter the wedding date."
                );

                return;
            }

            weddingDate =
                input.value;

            localStorage.setItem(
                "weddingDate",
                weddingDate
            );

            startCountdown();
        }


        /*
         * CHANGE DATE
         */

        function changeDate() {

            if (countdownInterval) {

                clearInterval(
                    countdownInterval
                );

                countdownInterval = null;
            }

            localStorage.removeItem(
                "weddingDate"
            );

            weddingDate = null;

            document
                .getElementById("countdown")
                .classList.remove("show");

            document
                .getElementById("anniversary")
                .classList.remove("show");

            document
                .getElementById("setup")
                .classList.remove("hidden");

            document
                .getElementById("weddingDate")
                .value = "";
        }


        /*
         * START COUNTDOWN
         */

        function startCountdown() {

            document
                .getElementById("setup")
                .classList.add("hidden");

            if (countdownInterval) {

                clearInterval(
                    countdownInterval
                );
            }

            updateCountdown();

            countdownInterval =
                setInterval(
                    updateCountdown,
                    1000
                );
        }


        /*
         * UPDATE COUNTDOWN
         */

        function updateCountdown() {

            if (!weddingDate) {
                return;
            }

            const parts =
                weddingDate.split("-");

            if (parts.length !== 3) {
                return;
            }

            const marriageYear =
                parseInt(
                    parts[0],
                    10
                );

            const marriageMonth =
                parseInt(
                    parts[1],
                    10
                ) - 1;

            const marriageDay =
                parseInt(
                    parts[2],
                    10
                );

            const now =
                new Date();

            let anniversary =
                new Date(
                    now.getFullYear(),
                    marriageMonth,
                    marriageDay
                );


            /*
             * CHECK IF TODAY
             */

            const isToday =
                now.getMonth() ===
                    marriageMonth &&
                now.getDate() ===
                    marriageDay;


            /*
             * CALCULATE YEARS
             */

            let years =
                now.getFullYear() -
                marriageYear;

            if (
                now.getMonth() <
                    marriageMonth ||
                (
                    now.getMonth() ===
                        marriageMonth &&
                    now.getDate() <
                        marriageDay
                )
            ) {
                years--;
            }


            /*
             * ANNIVERSARY TODAY
             */

            if (isToday) {

                showAnniversary(
                    years
                );

                return;
            }


            /*
             * NEXT YEAR
             */

            if (now > anniversary) {

                anniversary =
                    new Date(
                        now.getFullYear() + 1,
                        marriageMonth,
                        marriageDay
                    );
            }


            /*
             * DIFFERENCE
             */

            const difference =
                anniversary.getTime() -
                now.getTime();

            const totalSeconds =
                Math.max(
                    0,
                    Math.floor(
                        difference / 1000
                    )
                );


            const days =
                Math.floor(
                    totalSeconds / 86400
                );

            const hours =
                Math.floor(
                    (totalSeconds % 86400) /
                    3600
                );

            const minutes =
                Math.floor(
                    (totalSeconds % 3600) /
                    60
                );

            const seconds =
                totalSeconds % 60;


            /*
             * SHOW COUNTDOWN
             */

            document
                .getElementById("anniversary")
                .classList.remove("show");

            document
                .getElementById("countdown")
                .classList.add("show");


            document
                .getElementById("days")
                .textContent =
                days;


            document
                .getElementById("hours")
                .textContent =
                String(hours)
                    .padStart(2, "0");


            document
                .getElementById("minutes")
                .textContent =
                String(minutes)
                    .padStart(2, "0");


            document
                .getElementById("seconds")
                .textContent =
                String(seconds)
                    .padStart(2, "0");


            /*
             * NEXT ANNIVERSARY
             */

            document
                .getElementById("nextDate")
                .textContent =
                "Next anniversary: " +
                anniversary.toLocaleDateString(
                    undefined,
                    {
                        day: "numeric",
                        month: "long",
                        year: "numeric"
                    }
                );
        }


        /*
         * SHOW ANNIVERSARY
         */

        function showAnniversary(
            years
        ) {

            document
                .getElementById("countdown")
                .classList.remove("show");

            document
                .getElementById("anniversary")
                .classList.add("show");


            document
                .getElementById("years")
                .textContent =
                years;


            document
                .getElementById("yearsText")
                .textContent =
                years +
                (
                    years === 1
                        ? " year"
                        : " years"
                );


            const date =
                new Date(
                    weddingDate +
                    "T00:00:00"
                );


            document
                .getElementById(
                    "anniversaryDate"
                )
                .textContent =
                "Married since " +
                date.toLocaleDateString(
                    undefined,
                    {
                        day: "numeric",
                        month: "long",
                        year: "numeric"
                    }
                );
        }

    </script>

</body>
</html>
