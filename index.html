<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>Your Anniversary</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 12px;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Helvetica,
                Arial,
                sans-serif;

            background: #f5f5f5;
            color: #171717;

            overflow-x: hidden;
        }

        /* MAIN CARD */

        .card {
            width: 100%;
            max-width: 500px;

            padding: 40px 20px;

            background: white;

            border: 1px solid #e5e5e5;
            border-radius: 22px;

            text-align: center;

            box-shadow:
                0 15px 45px rgba(0, 0, 0, 0.06);
        }

        /* HEART */

        .heart {
            font-size: 42px;
            color: #e63946;

            margin-bottom: 18px;

            animation: heartbeat 2s infinite;
        }

        @keyframes heartbeat {
            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.08);
            }
        }

        /* TITLE */

        h1 {
            font-size: 28px;
            font-weight: 600;

            letter-spacing: -0.5px;

            margin-bottom: 10px;
        }

        /* SUBTITLE */

        .subtitle {
            color: #777;

            font-size: 15px;
            line-height: 1.55;

            margin: 0 auto 30px;

            max-width: 330px;
        }

        /* SETUP */

        .setup {
            width: 100%;
        }

        .setup.hidden {
            display: none;
        }

        /*
            MOBILE DATE INPUT

            Important:
            The width is controlled by the parent.
            iPhone's native date input sometimes
            tries to use its own intrinsic width.
        */

        .date-wrapper {
            width: 100%;
            display: flex;
            justify-content: center;
        }

        .date-input {
            display: block;

            width: 100%;
            max-width: 100%;

            height: 54px;

            padding: 0 14px;

            border: 1px solid #dcdcdc;
            border-radius: 12px;

            background: #fafafa;

            color: #171717;

            font-family: inherit;
            font-size: 16px;

            outline: none;

            -webkit-appearance: none;
            appearance: none;

            text-align: left;
        }

        .date-input:focus {
            background: white;

            border-color: #999;

            box-shadow:
                0 0 0 3px rgba(0, 0, 0, 0.04);
        }

        /*
            This makes the date picker text
            stay inside the input on iPhone.
        */

        .date-input::-webkit-date-and-time-value {
            text-align: left;
        }

        /* BUTTON */

        button {
            display: block;

            width: 100%;
            height: 54px;

            margin-top: 14px;

            border: none;
            border-radius: 12px;

            background: #171717;
            color: white;

            font-family: inherit;
            font-size: 16px;
            font-weight: 500;

            cursor: pointer;

            -webkit-tap-highlight-color: transparent;
        }

        button:active {
            opacity: 0.8;
        }

        /* COUNTDOWN */

        .countdown {
            display: none;
            width: 100%;
        }

        .countdown.show {
            display: block;
        }

        .label {
            color: #888;

            font-size: 14px;

            margin-bottom: 8px;
        }

        .days {
            font-size: 70px;
            line-height: 1;

            font-weight: 700;

            letter-spacing: -3px;

            margin: 10px 0;
        }

        .days-text {
            color: #777;

            font-size: 15px;

            margin-bottom: 28px;
        }

        /* TIMER */

        .timer {
            width: 100%;

            display: grid;

            grid-template-columns:
                repeat(3, minmax(0, 1fr));

            gap: 7px;

            margin-bottom: 25px;
        }

        .time-box {
            min-width: 0;

            padding: 13px 4px;

            background: #f7f7f7;

            border-radius: 12px;
        }

        .time-number {
            font-size: 20px;
            font-weight: 600;
        }

        .time-label {
            color: #888;

            font-size: 10px;

            margin-top: 3px;
        }

        .next-date {
            color: #888;

            font-size: 13px;

            margin-bottom: 18px;
        }

        /* CHANGE BUTTON */

        .change-button {
            background: transparent;

            color: #777;

            border: 1px solid #ddd;

            margin-top: 0;
        }

        .change-button:active {
            background: #fafafa;
        }

        /* ANNIVERSARY */

        .anniversary {
            display: none;
            width: 100%;
        }

        .anniversary.show {
            display: block;

            animation: appear 0.6s ease;
        }

        .big-heart {
            font-size: 65px;

            color: #e63946;

            margin-bottom: 18px;

            animation: heartbeat 1.5s infinite;
        }

        .anniversary h2 {
            font-size: 28px;

            font-weight: 600;

            line-height: 1.3;

            margin-bottom: 15px;
        }

        .years {
            font-size: 58px;

            font-weight: 700;

            letter-spacing: -2px;

            margin: 10px 0;
        }

        .anniversary-text {
            color: #777;

            font-size: 15px;

            line-height: 1.6;

            margin-bottom: 25px;
        }

        .anniversary-text strong {
            color: #171717;
        }

        .anniversary-date {
            color: #999;

            font-size: 13px;
        }

        /* ANIMATION */

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* SMALL PHONES */

        @media (max-width: 380px) {

            body {
                padding: 8px;
            }

            .card {
                padding: 32px 16px;
                border-radius: 20px;
            }

            h1 {
                font-size: 25px;
            }

            .subtitle {
                font-size: 14px;
            }

            .days {
                font-size: 58px;
            }

            .years {
                font-size: 50px;
            }

            .anniversary h2 {
                font-size: 25px;
            }
        }
    </style>
</head>

<body>

    <main class="card">

        <!-- SETUP -->

        <section class="setup" id="setup">

            <div class="heart">♥</div>

            <h1>Your Anniversary</h1>

            <p class="subtitle">
                Enter the date your parents got married
                and we'll keep track of their special day.
            </p>

            <div class="date-wrapper">

                <input
                    type="date"
                    id="weddingDate"
                    class="date-input"
                    aria-label="Wedding date"
                >

            </div>

            <button
                type="button"
                onclick="saveDate()"
            >
                Continue
            </button>

        </section>


        <!-- COUNTDOWN -->

        <section
            class="countdown"
            id="countdown"
        >

            <div class="heart">♥</div>

            <div class="label">
                Until your anniversary
            </div>

            <div
                class="days"
                id="days"
            >
                0
            </div>

            <div class="days-text">
                days more for your anniversary
            </div>

            <div class="timer">

                <div class="time-box">

                    <div
                        class="time-number"
                        id="hours"
                    >
                        00
                    </div>

                    <div class="time-label">
                        HOURS
                    </div>

                </div>


                <div class="time-box">

                    <div
                        class="time-number"
                        id="minutes"
                    >
                        00
                    </div>

                    <div class="time-label">
                        MINUTES
                    </div>

                </div>


                <div class="time-box">

                    <div
                        class="time-number"
                        id="seconds"
                    >
                        00
                    </div>

                    <div class="time-label">
                        SECONDS
                    </div>

                </div>

            </div>

            <div
                class="next-date"
                id="nextDate"
            ></div>

            <button
                type="button"
                class="change-button"
                onclick="changeDate()"
            >
                Change wedding date
            </button>

        </section>


        <!-- ANNIVERSARY -->

        <section
            class="anniversary"
            id="anniversary"
        >

            <div class="big-heart">
                ♥
            </div>

            <h2>
                Happy Anniversary<br>
                Amma and Appa
            </h2>

            <div
                class="years"
                id="years"
            >
                0
            </div>

            <p class="anniversary-text">

                You have been married for

                <strong id="yearsText">
                    0 years
                </strong>

                and many more to go.

            </p>

            <div
                class="anniversary-date"
                id="anniversaryDate"
            ></div>

            <button
                type="button"
                class="change-button"
                onclick="changeDate()"
            >
                Change wedding date
            </button>

        </section>

    </main>


    <script>

        let weddingDate =
            localStorage.getItem("weddingDate");

        let countdownInterval = null;


        /* LOAD SAVED DATE */

        if (weddingDate) {
            startCountdown();
        }


        /* SAVE DATE */

        function saveDate() {

            const input =
                document.getElementById("weddingDate");

            if (!input.value) {

                alert(
                    "Please enter the wedding date."
                );

                return;
            }

            weddingDate = input.value;

            localStorage.setItem(
                "weddingDate",
                weddingDate
            );

            startCountdown();
        }


        /* CHANGE DATE */

        function changeDate() {

            if (countdownInterval) {

                clearInterval(
                    countdownInterval
                );

                countdownInterval = null;
            }

            localStorage.removeItem(
                "weddingDate"
            );

            weddingDate = null;

            document
                .getElementById("countdown")
                .classList.remove("show");

            document
                .getElementById("anniversary")
                .classList.remove("show");

            document
                .getElementById("setup")
                .classList.remove("hidden");

            document
                .getElementById("weddingDate")
                .value = "";
        }


        /* START COUNTDOWN */

        function startCountdown() {

            document
                .getElementById("setup")
                .classList.add("hidden");

            if (countdownInterval) {

                clearInterval(
                    countdownInterval
                );
            }

            updateCountdown();

            countdownInterval =
                setInterval(
                    updateCountdown,
                    1000
                );
        }


        /* UPDATE COUNTDOWN */

        function updateCountdown() {

            if (!weddingDate) {
                return;
            }

            const parts =
                weddingDate.split("-");

            if (parts.length !== 3) {
                return;
            }

            const marriageYear =
                parseInt(parts[0], 10);

            const marriageMonth =
                parseInt(parts[1], 10) - 1;

            const marriageDay =
                parseInt(parts[2], 10);

            const now = new Date();

            let anniversary =
                new Date(
                    now.getFullYear(),
                    marriageMonth,
                    marriageDay,
                    0,
                    0,
                    0
                );


            /* CHECK TODAY */

            const isToday =
                now.getMonth() === marriageMonth &&
                now.getDate() === marriageDay;


            /* CALCULATE YEARS */

            let years =
                now.getFullYear() -
                marriageYear;

            if (
                now.getMonth() < marriageMonth ||
                (
                    now.getMonth() === marriageMonth &&
                    now.getDate() < marriageDay
                )
            ) {
                years--;
            }


            /* ANNIVERSARY TODAY */

            if (isToday) {

                showAnniversary(years);

                return;
            }


            /* NEXT YEAR */

            if (now > anniversary) {

                anniversary =
                    new Date(
                        now.getFullYear() + 1,
                        marriageMonth,
                        marriageDay,
                        0,
                        0,
                        0
                    );
            }


            /* DIFFERENCE */

            const difference =
                anniversary.getTime() -
                now.getTime();

            const totalSeconds =
                Math.max(
                    0,
                    Math.floor(
                        difference / 1000
                    )
                );


            const days =
                Math.floor(
                    totalSeconds / 86400
                );

            const hours =
                Math.floor(
                    (totalSeconds % 86400) /
                    3600
                );

            const minutes =
                Math.floor(
                    (totalSeconds % 3600) /
                    60
                );

            const seconds =
                totalSeconds % 60;


            /* SHOW COUNTDOWN */

            document
                .getElementById("anniversary")
                .classList.remove("show");

            document
                .getElementById("countdown")
                .classList.add("show");


            document
                .getElementById("days")
                .textContent = days;


            document
                .getElementById("hours")
                .textContent =
                String(hours)
                    .padStart(2, "0");


            document
                .getElementById("minutes")
                .textContent =
                String(minutes)
                    .padStart(2, "0");


            document
                .getElementById("seconds")
                .textContent =
                String(seconds)
                    .padStart(2, "0");


            document
                .getElementById("nextDate")
                .textContent =
                "Next anniversary: " +
                anniversary.toLocaleDateString(
                    undefined,
                    {
                        day: "numeric",
                        month: "long",
                        year: "numeric"
                    }
                );
        }


        /* ANNIVERSARY SCREEN */

        function showAnniversary(years) {

            document
                .getElementById("countdown")
                .classList.remove("show");

            document
                .getElementById("anniversary")
                .classList.add("show");


            document
                .getElementById("years")
                .textContent = years;


            document
                .getElementById("yearsText")
                .textContent =
                years +
                (
                    years === 1
                        ? " year"
                        : " years"
                );


            const date =
                new Date(
                    weddingDate +
                    "T00:00:00"
                );


            document
                .getElementById("anniversaryDate")
                .textContent =
                "Married since " +
                date.toLocaleDateString(
                    undefined,
                    {
                        day: "numeric",
                        month: "long",
                        year: "numeric"
                    }
                );
        }

    </script>

</body>
</html>
